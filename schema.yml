openapi: 3.0.3
info:
  title: Campus Innovation & Engagement Intelligence Hub API
  version: 1.0.0
  description: AI-driven platform for semantic matchmaking, graph intelligence, and
    predictive analytics.
paths:
  /api/v1/accounts/profile/{id}/:
    get:
      operationId: v1_accounts_profile_retrieve
      description: Access-controlled endpoint. Students are restricted to 'Self' only.
      summary: Restricted Profile Detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSummary'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/dashboard/my/:
    get:
      operationId: v1_dashboard_my_retrieve
      description: Returns personal metrics for students or institutional aggregates
        for leadership.
      summary: Role-based aggregate dashboard
      tags:
      - Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                StudentDashboard:
                  value:
                    profile:
                      full_name: Sanjay
                    achievements_count: 12
                    startups_count: 1
                  summary: Student Dashboard
                LeadershipDashboard:
                  value:
                    total_students: 5000
                    active_startups: 42
                    total_funding_inr: 15000000
                  summary: Leadership Dashboard
          description: ''
